spring.application.name=URL-Shortener
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8080}

# --- MySQL Database Configuration ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/url_shortener?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- Flyway Migrations ---
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# --- Redis L2 Cache Configuration ---
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# --- RabbitMQ Configuration ---
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
# Allow graceful startup if RabbitMQ is offline during local development
spring.rabbitmq.listener.simple.auto-startup=${RABBITMQ_ENABLED:false}

# --- Application Custom Properties ---
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.keygen.strategy=counter
server.forward-headers-strategy=framework

# --- MaxMind GeoIP2 Configuration ---
maxmind.geoip.account-id=${MAXMIND_GEOIP_ACCOUNT_ID:0}
maxmind.geoip.license-key=${MAXMIND_GEOIP_LICENSE_KEY:}
maxmind.geoip.host=${MAXMIND_GEOIP_HOST:geolite.info}
maxmind.geoip.database-path=${MAXMIND_GEOIP_DATABASE_PATH:data/GeoLite2-City.mmdb}

# --- Logging Configuration ---
logging.level.com.deb=INFO
logging.level.com.deb.aspect=INFO
logging.level.com.deb.repository=DEBUG