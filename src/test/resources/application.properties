spring.application.name=URL-Shortener-Test

# --- H2 In-Memory Database (MySQL Mode) for Tests ---
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Flyway for in-memory H2 tests
spring.flyway.enabled=false

# Disable background message listeners during automated tests
spring.rabbitmq.listener.simple.auto-startup=false
spring.data.redis.listener.auto-startup=false

app.base-url=http://localhost:8080
app.keygen.strategy=counter
